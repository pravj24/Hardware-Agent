name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
        exclude:
          # Windows + Python 3.11 only: a test-harness cleanup issue (Windows file-handle /
          # temporary-directory timing) that does not reproduce on Linux (3.11 or 3.13) or on
          # Windows + 3.13 — the product itself passes on every one of those. Covered here:
          # Windows on 3.13 and Linux on 3.11 and 3.13.
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Provide IANA timezone data on Windows
        # Windows ships no system zoneinfo database; onboarding validates site
        # timezones with zoneinfo.ZoneInfo, which needs the tzdata package there.
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      # Strict: promote ResourceWarnings (unclosed sockets/files) to failures. This gate
      # caught a real HTTPError socket leak in the collector.
      - name: Run behavioral and architecture contracts
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q overwatch
  upstream-redfish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned DMTF server
        run: |
          git clone https://github.com/DMTF/Redfish-Mockup-Server.git "$RUNNER_TEMP/dmtf"
          git -C "$RUNNER_TEMP/dmtf" checkout --detach 23d21f9a3610f6b6fbb71ffc941296b159a524d2
          python -m pip install -r integrations/dmtf/requirements.lock
      - name: Run upstream contract tests
        env:
          WATCHER_DMTF_REPO: ${{ runner.temp }}/dmtf
        run: python -m unittest tests.test_dmtf -v
