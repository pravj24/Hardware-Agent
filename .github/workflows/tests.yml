name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Provide IANA timezone data on Windows
        # Windows ships no system zoneinfo database; onboarding validates site
        # timezones with zoneinfo.ZoneInfo, which needs the tzdata package there.
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      # Strict: promote ResourceWarnings (unclosed sockets/files) to failures on Linux,
      # where GC/close timing is deterministic. This gate caught a real HTTPError socket
      # leak in the collector.
      - name: Run behavioral and architecture contracts (strict warnings)
        if: runner.os != 'Windows'
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      # Windows runs the full suite and must pass it, but does not promote ResourceWarnings
      # to failures: Windows socket/handle GC timing surfaces benign cleanup warnings
      # (notably on Python 3.11) that are not logic failures.
      - name: Run behavioral and architecture contracts (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q overwatch
  upstream-redfish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch pinned DMTF server
        run: |
          git clone https://github.com/DMTF/Redfish-Mockup-Server.git "$RUNNER_TEMP/dmtf"
          git -C "$RUNNER_TEMP/dmtf" checkout --detach 23d21f9a3610f6b6fbb71ffc941296b159a524d2
          python -m pip install -r integrations/dmtf/requirements.lock
      - name: Run upstream contract tests
        env:
          WATCHER_DMTF_REPO: ${{ runner.temp }}/dmtf
        run: python -m unittest tests.test_dmtf -v
