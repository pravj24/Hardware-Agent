services:
  redfish-mock:
    build:
      context: ./integrations/dmtf
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/redfish/v1/', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5
