[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "watchermcp"
version = "0.1.0"
description = "Evidence-first hardware operations and Redfish verification lab"
requires-python = ">=3.11"
# Linux/macOS use the system IANA timezone database; Windows ships none, and the
# onboarding rehearsal validates site timezones with zoneinfo.ZoneInfo, so tzdata is
# required there. No runtime dependency is added on Linux/macOS.
dependencies = ["tzdata; platform_system == 'Windows'"]

# Core app, demo and default tests use only the standard library. The assist feature's
# live LLM path is the one optional dependency; it is imported lazily and only needed
# when ANTHROPIC_API_KEY is configured. Install with: pip install watchermcp[assist]
[project.optional-dependencies]
assist = ["anthropic>=0.40"]

[project.scripts]
watchermcp = "overwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["overwatch*"]

[tool.setuptools.package-data]
overwatch = ["web/*.html", "web/*.css", "web/*.js"]
