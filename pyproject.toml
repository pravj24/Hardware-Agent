[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "watchermcp"
version = "0.1.0"
description = "Evidence-first hardware operations and Redfish verification lab"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
watchermcp = "overwatch.__main__:main"

[tool.setuptools.packages.find]
include = ["overwatch*"]

[tool.setuptools.package-data]
overwatch = ["web/*.html", "web/*.css", "web/*.js"]
